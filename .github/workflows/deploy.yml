name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        working-directory: laravel
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install dependencies
        working-directory: laravel
        run: npm install

      - name: Build
        working-directory: laravel
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir -p deploy/manga-kuchikomi.jp/public_html
          rsync -a \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='public/' \
            --exclude='tests/' \
            --exclude='database/*.sqlite*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            laravel/ deploy/manga-kuchikomi.jp/
          rsync -a laravel/public/ deploy/manga-kuchikomi.jp/public_html/
          test -f deploy/manga-kuchikomi.jp/vendor/autoload.php
          test -f deploy/manga-kuchikomi.jp/public_html/index.php
          test -f deploy/manga-kuchikomi.jp/public_html/.htaccess
          test ! -e deploy/manga-kuchikomi.jp/.env
          tar -C deploy/manga-kuchikomi.jp -czf deploy.tar.gz .

      - name: Upload deployment archive via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './deploy.tar.gz'
          remote_path: 'manga-kuchikomi.jp/'
          sftp_only: true
          delete_remote_files: false

      - name: Publish application on Xserver
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/xserver
          chmod 600 ~/.ssh/xserver
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 10022 \
            -i ~/.ssh/xserver \
            "$SSH_USERNAME@$SSH_HOST" \
            'cd manga-kuchikomi.jp && tar -xzf deploy.tar.gz && rm deploy.tar.gz                && /opt/php-8.4/bin/php artisan view:clear                && /opt/php-8.4/bin/php artisan config:clear                && /opt/php-8.4/bin/php artisan route:clear'

      - name: Verify canonical on the live site
        run: |
          # サイトマップに載っているジャンルURLを1本取り、canonical が
          # keyword を保っているか本番で確かめる。url()->current() はクエリを落とす。
          U='https://manga-kuchikomi.jp/search?keyword=%E7%95%B0%E4%B8%96%E7%95%8C'
          for i in 1 2 3 4 5; do
            BODY=$(curl -sS --max-time 30 "$U" || true)
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$U" || true)
            CANON=$(printf '%s' "$BODY" | grep -o 'rel="canonical" href="[^"]*"' | head -1)
            echo "試行 $i  HTTP $CODE  $CANON"
            case "$CANON" in *keyword=*) echo 'canonical が keyword を保っている'; exit 0;; esac
            sleep 10
          done
          echo 'canonical に keyword が入らない。Blade のキャッシュか反映漏れ' >&2
          exit 1
