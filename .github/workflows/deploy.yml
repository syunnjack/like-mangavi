name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xserver-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: '10022'
      XSERVER_WEB_IP: '85.131.221.80'
      GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        working-directory: laravel
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install dependencies
        working-directory: laravel
        run: npm ci

      - name: Build
        working-directory: laravel
        run: npm run build

      - name: Validate deployment settings and report DNS
        id: routing
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          [[ "$GA4_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]] || {
            echo "::error::GA4_MEASUREMENT_ID must be a valid GA4 measurement ID."
            exit 1
          }
          if [[ -n "$GOOGLE_SITE_VERIFICATION" ]] &&
             [[ ! "$GOOGLE_SITE_VERIFICATION" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::GOOGLE_SITE_VERIFICATION contains unsupported characters."
            exit 1
          fi

          mapfile -t domain_ips < <(getent ahostsv4 manga-kuchikomi.jp | awk '{print $1}' | sort -u)
          mapfile -t ssh_ips < <(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)
          if [ "${#ssh_ips[@]}" -eq 0 ]; then
            echo "::error::SSH_HOST did not resolve to an IPv4 address."
            exit 1
          fi

          dns_matches=false
          if printf '%s\n' "${domain_ips[@]}" | grep -Fqx "$XSERVER_WEB_IP"; then
            dns_matches=true
          else
            echo "::warning::Public DNS still points away from the deployment server. Deployment will continue and use a Host-fixed smoke test."
          fi

          {
            echo "dns_matches=$dns_matches"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### DNS routing"
            echo "- Public A: ${domain_ips[*]:-unresolved}"
            echo "- Expected Xserver web A: $XSERVER_WEB_IP"
            echo "- SSH host A: ${ssh_ips[*]}"
            echo "- Public DNS matches deployment server: $dns_matches"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package application
        shell: bash
        run: |
          mkdir -p deploy
          tar \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='tests' \
            --exclude='database/*.sqlite*' \
            -C laravel \
            -czf "$GITHUB_WORKSPACE/deploy/release-$GITHUB_SHA.tar.gz" .

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host_keys="$(ssh-keyscan -p "$SSH_PORT" "$SSH_HOST")"
          if [ -z "$host_keys" ]; then
            echo "::error::Could not retrieve the Xserver SSH host key."
            exit 1
          fi
          printf '%s\n' "$host_keys" >> ~/.ssh/known_hosts

      - name: Prepare remote upload directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          SSH_TARGET="$SSH_USERNAME@$SSH_HOST"
          SSH_ARGS=(-i ~/.ssh/deploy_key -p "$SSH_PORT")
          ssh "${SSH_ARGS[@]}" "$SSH_TARGET" 'mkdir -p manga-kuchikomi-app/uploads'

      - name: Upload release without deleting remote files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './deploy/release-${{ github.sha }}.tar.gz'
          remote_path: 'manga-kuchikomi-app/uploads/release-${{ github.sha }}.tar.gz'
          sftp_only: true
          delete_remote_files: false

      - name: Activate release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          SSH_TARGET="$SSH_USERNAME@$SSH_HOST"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "bash -s -- '$GITHUB_SHA' '$GA4_MEASUREMENT_ID' '$GOOGLE_SITE_VERIFICATION'" \
            < .github/scripts/deploy-xserver.sh

      - name: Verify activated release over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          SSH_TARGET="$SSH_USERNAME@$SSH_HOST"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "test \"\$(readlink \"\$HOME/manga-kuchikomi-app/current\")\" = \"\$HOME/manga-kuchikomi-app/releases/$GITHUB_SHA\" &&
             test -f \"\$HOME/manga-kuchikomi-app/current/vendor/autoload.php\" &&
             test -L \"\$HOME/manga-kuchikomi-app/current/.env\" &&
             test -L \"\$HOME/manga-kuchikomi-app/current/storage\" &&
             test -s \"\$HOME/manga-kuchikomi-app/shared/database/database.sqlite\" &&
             test -L \"\$HOME/manga-kuchikomi.jp/public_html/storage\" &&
             test -f \"\$HOME/manga-kuchikomi.jp/public_html/index.php\" &&
             grep -Fqx 'GA4_MEASUREMENT_ID=$GA4_MEASUREMENT_ID' \"\$HOME/manga-kuchikomi-app/shared/.env\""

      - name: Verify new Xserver virtual host
        shell: bash
        env:
          DNS_MATCHES: ${{ steps.routing.outputs.dns_matches }}
        run: |
          tls_verified=false
          tls_warning_emitted=false
          attempts=1
          if [ "$DNS_MATCHES" = true ]; then
            attempts=6
          fi
          for attempt in $(seq 1 "$attempts"); do
            if response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --resolve "manga-kuchikomi.jp:443:$XSERVER_WEB_IP" \
                https://manga-kuchikomi.jp/
            )"; then
              tls_verified=true
            else
              if [ "$tls_warning_emitted" = false ]; then
                echo "::warning::The new Xserver does not yet present a trusted certificate for manga-kuchikomi.jp. Continuing the fixed-IP application smoke test without certificate verification."
                tls_warning_emitted=true
              fi
              response="$(
                curl \
                  --insecure \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --resolve "manga-kuchikomi.jp:443:$XSERVER_WEB_IP" \
                  https://manga-kuchikomi.jp/
              )" || true
            fi
            if grep -Fq "gtag/js?id=$GA4_MEASUREMENT_ID" <<< "$response"; then
              {
                echo "### Host-fixed production smoke"
                echo "- URL: https://manga-kuchikomi.jp/"
                echo "- Forced server: $XSERVER_WEB_IP"
                echo "- Laravel response and GA4 tag: verified"
                echo "- Trusted domain certificate: $tls_verified"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          if [ "$DNS_MATCHES" != true ]; then
            echo "::warning::The fixed-IP request reached Xserver but the domain vhost is not externally available before DNS cutover. The activated release was verified over SSH."
            {
              echo "### Host-fixed production smoke"
              echo "- URL: https://manga-kuchikomi.jp/"
              echo "- Forced server: $XSERVER_WEB_IP"
              echo "- Xserver domain vhost: unavailable before DNS cutover"
              echo "- Activated release over SSH: verified"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The new Xserver virtual host did not return the deployed GA4 tag."
          exit 1
